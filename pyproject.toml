[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-trak"
version = "0.1.0"
description = "Exact batched TRAK data attribution for LoRA-tuned causal language models, built for Qwen 3.5."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alireza-Zwolf" }]
requires-python = ">=3.10"
keywords = ["data attribution", "TRAK", "LoRA", "Qwen", "per-example gradients"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "torch>=2.0",
    "transformers>=4.56",
    "peft>=0.13",
    "traker>=0.3.2",
]

[project.optional-dependencies]
cuda = ["fast_jl"]          # CUDA random projector (needs a CUDA toolchain to build)
qwen35 = ["fla-core"]       # Triton kernel for Qwen 3.5's gated delta rule
dev = ["pytest", "ruff", "tokenizers"]

[project.scripts]
fast-trak = "fast_trak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
